<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        ONG Projeto Social
    </title>

    <link
        rel="stylesheet"
        href="../css/styles.css">

</head>


<body>

    <header>

        <h1>ONG Projeto Social</h1>

        <nav
            aria-label="Navegação principal">

            <a href="#inicio">
                Início
            </a>

            <a href="#projetos">
                Projetos
            </a>

            <a href="#cadastro">
                Cadastro
            </a>

        </nav>

    </header>


    <!-- Conteúdo dinâmico da SPA -->

    <main
        id="app"
        tabindex="-1">
    </main>


    <!-- Modal -->

    <dialog
        id="modal-privacidade"
        class="modal-feedback"
        aria-labelledby="titulo-modal">

        <h2 id="titulo-modal">
            Uso dos dados
        </h2>

        <p>
            As informações fornecidas serão
            utilizadas apenas para contato
            relacionado às ações e oportunidades
            da ONG.
        </p>

        <div class="modal-acoes">

            <button
                type="button"
                data-acao="fechar-modal">

                Entendi

            </button>

        </div>

    </dialog>


    <!-- Toast -->

    <div
        id="toast-sucesso"
        class="toast-feedback"
        role="status"
        aria-live="polite"
        hidden>
    </div>


    <footer>

        <p>
            © 2026 ONG Projeto Social -
            Todos os direitos reservados.
        </p>

    </footer>


    <script
        type="module"
        src="../js/main.js">
    </script>

</body>

</html>
