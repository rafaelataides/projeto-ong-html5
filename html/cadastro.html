<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - ONG Projeto Social</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <header>
        <h1>ONG Projeto Social</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Cadastro de voluntários e colaboradores</h2>

            <picture>
                <source
                    srcset="../imagens/cadastro.webp"
                    type="image/webp">

                <img
                    src="../imagens/cadastro.png"
                    alt="Equipe de voluntários utilizando um computador para realizar cadastros">
            </picture>

            <p>
                Preencha o formulário abaixo para demonstrar interesse
                em participar das ações, projetos e atividades da ONG.
            </p>
        </section>

        <form action="#" method="post">

            <fieldset>

                <legend>Dados pessoais</legend>

                <p>
                    <label for="nome">Nome completo:</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required>
                </p>

                <p>
                    <label for="nascimento">Data de nascimento:</label>
                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        required>
                </p>

                <p>
                    <label for="cpf">CPF:</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                        title="Digite o CPF no formato 000.000.000-00"
                        required>
                </p>

            </fieldset>

            <fieldset>

                <legend>Dados de contato</legend>

                <p>
                    <label for="email">E-mail:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@email.com"
                        required>
                </p>

                <p>
                    <label for="telefone">Telefone:</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(11) 99999-9999"
                        pattern="\(\d{2}\)\s?\d{4,5}-\d{4}"
                        title="Digite o telefone no formato (11) 99999-9999"
                        required>
                </p>

            </fieldset>

            <fieldset>

                <legend>Endereço</legend>

                <p>
                    <label for="endereco">Endereço:</label>
                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        required>
                </p>

                <p>
                    <label for="cidade">Cidade:</label>
                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        required>
                </p>

                <p>
                    <label for="estado">Estado:</label>

                    <select
                        id="estado"
                        name="estado"
                        required>

                        <option value="">Selecione</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="ES">Espírito Santo</option>

                    </select>
                </p>

                <p>
                    <label for="cep">CEP:</label>
                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="00000-000"
                        pattern="\d{5}-\d{3}"
                        title="Digite o CEP no formato 00000-000"
                        required>
                </p>

            </fieldset>

            <button type="submit">
                Enviar cadastro
            </button>

        </form>

    </main>

    <footer>
        <p>
            © 2026 ONG Projeto Social - Todos os direitos reservados.
        </p>
    </footer>

</body>

</html>
